name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build executable and portable package
        run: python scripts/build_release.py
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          & $iscc "/DMyAppVersion=3.47.0" "packaging\installer.iss"
      - name: Refresh checksum manifest including installer
        shell: pwsh
        run: |
          $files = @("dist\GitHubCommandCenter.exe", "dist\GitHubCommandCenter-3.47.0-portable.zip", "dist\installer\GitHubCommandCenterSetup-3.47.0.exe")
          $lines = foreach ($file in $files) { $h=(Get-FileHash $file -Algorithm SHA256).Hash.ToLower(); "$h  $([IO.Path]::GetFileName($file))" }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - name: Package smoke test
        run: python scripts/smoke_packaged.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubCommandCenter-v3.47.0-Windows
          path: |
            dist/GitHubCommandCenter.exe
            dist/GitHubCommandCenter-3.47.0-portable.zip
            dist/installer/GitHubCommandCenterSetup-3.47.0.exe
            dist/SHA256SUMS.txt

name: Windows validation
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Windows environment validation
        run: python scripts/windows_validate.py
      - name: Startup performance profile
        run: python scripts/profile_startup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-v3.52
          path: |
            windows-validation.json
            startup-performance.json

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-command-center"
version = "3.81.0"
description = "Desktop Git and GitHub productivity, safety, recovery, and release command center"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "coverage>=7.0",
  "ruff>=0.8",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "build>=1.2",
  "cyclonedx-bom>=5.0",
  "PyYAML>=6.0",
]

[project.scripts]
github-command-center = "github_command_center.app:main"

[tool.setuptools.packages.find]
include = ["github_command_center*"]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["github_command_center"]
omit = [
  "github_command_center/features/domains/*",
  "github_command_center/local_git_gui.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

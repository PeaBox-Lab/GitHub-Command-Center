name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and quality tools
        run: python -m pip install --upgrade pip keyring ruff bandit pip-audit
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reliability report
        run: python scripts/reliability_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reliability-report.json
      - name: Plugin manifest audit
        run: python -c "from github_command_center.services.plugin_security import PluginSecurityService; m=PluginSecurityService().load('examples/plugins/safe-status.plugin.json'); r=PluginSecurityService().assess(m); print(r); raise SystemExit(0 if r.allowed else 1)"
      - name: Architecture regression gate
        run: python scripts/architecture_gate.py
      - name: Ruff
        run: ruff check github_command_center tests
      - name: Bandit
        run: bandit -q -r github_command_center -x tests
      - name: Dependency audit
        run: pip-audit -r requirements.txt
